name: Daily citation database update

on:
  schedule:
    # Every day 04:30 UTC. GitHub may delay scheduled runs by minutes under load.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: add/refresh one focused topic (OpenAlex title+abstract query)'
        required: false
        default: ''
      days:
        description: 'Optional: override the ingest span in days'
        required: false
        default: ''

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # only used to publish the SQLite snapshot as a release asset
    env:
      GH_TOKEN: ${{ github.token }}
      SNAPSHOT_TAG: data-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # Two storage modes. With the DATABASE_URL secret (Neon Postgres) the database lives there.
      # Without it the database is one SQLite file that is restored from, and published back to,
      # the rolling release "data-latest" (OpenAlex metadata is CC0; no data is committed to git).
      - name: Restore previous SQLite snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p output
          if [ -z "$DATABASE_URL" ]; then
            if gh release download "$SNAPSHOT_TAG" -p research_velocity.db.gz -D output; then
              gunzip -f output/research_velocity.db.gz
              ls -l output/research_velocity.db
            else
              echo "No previous snapshot: this run starts a new database (30-day backfill)."
            fi
          fi
      - name: Ingest and compute indices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_POLITE_EMAIL: ${{ secrets.OPENALEX_POLITE_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          ARGS=""
          if [ -n "$TOPIC" ]; then ARGS="$ARGS --topic \"$TOPIC\""; fi
          if [ -n "$DAYS" ]; then ARGS="$ARGS --days $DAYS"; fi
          eval python -m pipeline.daily $ARGS
      - name: Publish SQLite snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            python -c "import sqlite3; c=sqlite3.connect('output/research_velocity.db'); c.execute('VACUUM'); c.close()"
            gzip -9 -f -k output/research_velocity.db
            ls -l output/research_velocity.db.gz
            gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1 || gh release create "$SNAPSHOT_TAG"               --title "Database snapshot (updated daily by CI)"               --notes "Rolling SQLite snapshot of the OpenAlex citation database. Replaced on every run; do not depend on its history."
            gh release upload "$SNAPSHOT_TAG" output/research_velocity.db.gz --clobber
          fi
