name: Weekly AI Research Velocity Digest

on:
  schedule:
    # Runs every Monday at 09:00 UTC (02:00 AM PT / 05:00 AM ET)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allows manual triggering with optional custom parameters
    inputs:
      lookback_days:
        description: 'Lookback window in days'
        required: false
        default: '7'
      min_citations:
        description: 'Minimum citation velocity threshold'
        required: false
        default: '5'
      dry_run:
        description: 'Dry run mode (generates artifact without sending email)'
        type: boolean
        required: false
        default: false

jobs:
  run-digest-pipeline:
    name: Run Inverted Index & Dispatch Digest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Pipeline
        env:
          OPENALEX_POLITE_EMAIL: ${{ secrets.OPENALEX_POLITE_EMAIL }}
          SMTP_HOST: 'smtp.gmail.com'
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.GMAIL_USER }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || secrets.GMAIL_USER }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          MIN_CITATION_VELOCITY: ${{ github.event.inputs.min_citations || '5' }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python -m pipeline.main --export-json output/digest.json $EXTRA_ARGS

      - name: Upload Digest Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-velocity-digest-output
          path: |
            output/digest_preview.html
            output/digest.json
          retention-days: 14
